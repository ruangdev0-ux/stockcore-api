# Workflow temporário: o ambiente de desenvolvimento deste projeto não tinha acesso ao NuGet,
# então a migration inicial é gerada aqui pelo dotnet-ef, depois de compilar e testar.
# Será removido assim que a migration estiver no repositório.
name: Bootstrap (migration inicial)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockcore
          POSTGRES_PASSWORD: stockcore
          POSTGRES_DB: stockcore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockcore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=stockcore_test;Username=stockcore;Password=stockcore
      MIGRATIONS_DIR: src/StockCore.Infrastructure/Persistence/Migrations
      EF_ARGS: --project src/StockCore.Infrastructure --startup-project src/StockCore.Api --configuration Release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Ferramentas (dotnet-ef)
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Gerar migration inicial
        id: migration
        run: |
          if [ -d "$MIGRATIONS_DIR" ]; then
            echo "Migrations já existem; nada a gerar."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            dotnet ef migrations add InitialCreate $EF_ARGS --output-dir Persistence/Migrations
            echo "created=true" >> "$GITHUB_OUTPUT"
            ls -la "$MIGRATIONS_DIR"
          fi

      - name: Build com a migration
        run: dotnet build --no-restore --configuration Release

      - name: Modelo e migrations sincronizados
        run: dotnet ef migrations has-pending-model-changes $EF_ARGS --no-build

      - name: Formatação
        run: dotnet format --verify-no-changes --no-restore --exclude "$MIGRATIONS_DIR"

      - name: Testes
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Exemplos reais de requisição e resposta (para o README)
        run: |
          export ASPNETCORE_ENVIRONMENT=Production
          export ConnectionStrings__Default="Host=localhost;Port=5432;Database=stockcore_demo;Username=stockcore;Password=stockcore"
          export Jwt__Key="$(openssl rand -hex 32)"
          export Database__ApplyMigrationsOnStartup=true
          export Database__Seed=true
          dotnet src/StockCore.Api/bin/Release/net8.0/StockCore.Api.dll --urls http://127.0.0.1:5080 > api.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:5080/health > /dev/null && break; sleep 1; done
          B=http://127.0.0.1:5080
          login() { curl -s "$B/api/auth/login" -H "Content-Type: application/json" -d "{\"email\":\"$1\",\"password\":\"demo12345\"}"; }
          ADMIN=$(login admin@exemplo.com | jq -r .accessToken)
          OPER=$(login operador@exemplo.com | jq -r .accessToken)
          VIEW=$(login leitor@exemplo.com | jq -r .accessToken)
          show() { echo; echo "### $1"; shift; curl -s -w '\nHTTP %{http_code}\n' "$@" | sed 's/"accessToken":"[^"]*"/"accessToken":"eyJhbGciOiJIUzI1NiIs..."/'; }
          J="Content-Type: application/json"
          show "login" "$B/api/auth/login" -H "$J" -d '{"email":"operador@exemplo.com","password":"demo12345"}'
          PID=$(curl -s "$B/api/products?search=BEB-001" -H "Authorization: Bearer $VIEW" | jq -r '.items[0].id')
          show "produtos abaixo do minimo" "$B/api/products?lowStock=true&sort=sku&pageSize=2" -H "Authorization: Bearer $VIEW"
          show "saida ok" "$B/api/movements/exits" -H "$J" -H "Authorization: Bearer $OPER" -d "{\"productId\":\"$PID\",\"quantity\":100,\"note\":\"Venda atacado\"}"
          EXIT_ID=$(curl -s "$B/api/movements?productId=$PID&type=Exit&status=Active&pageSize=1" -H "Authorization: Bearer $VIEW" | jq -r '.items[0].id')
          show "saida maior que o saldo" "$B/api/movements/exits" -H "$J" -H "Authorization: Bearer $OPER" -d "{\"productId\":\"$PID\",\"quantity\":50}"
          show "viewer tenta saida" "$B/api/movements/exits" -H "$J" -H "Authorization: Bearer $VIEW" -d "{\"productId\":\"$PID\",\"quantity\":1}"
          show "quantidade invalida" "$B/api/movements/exits" -H "$J" -H "Authorization: Bearer $OPER" -d "{\"productId\":\"$PID\",\"quantity\":0}"
          show "cancelamento" "$B/api/movements/$EXIT_ID/cancel" -H "$J" -H "Authorization: Bearer $ADMIN" -d '{"reason":"Quantidade digitada errada"}'
          show "cancelar de novo" "$B/api/movements/$EXIT_ID/cancel" -H "$J" -H "Authorization: Bearer $ADMIN" -d '{"reason":"Teste"}'
          show "alertas" "$B/api/alerts/low-stock" -H "Authorization: Bearer $VIEW"
          show "resumo" "$B/api/reports/stock-summary" -H "Authorization: Bearer $VIEW"
          show "health" "$B/health"

      - name: Teste de mutação (quebra a regra de saldo e espera falha)
        run: |
          file=src/StockCore.Domain/Rules/StockRules.cs
          sed -i 's/if (requested > available)/if (requested > available + 1000)/' "$file"
          grep -n "available + 1000" "$file"
          if dotnet test --configuration Release --filter "FullyQualifiedName~StockRulesTests|FullyQualifiedName~MovementTests" > mutation.log 2>&1; then
            tail -n 30 mutation.log
            echo "::error::A mutação não foi detectada pelos testes."
            exit 1
          fi
          grep -E "Failed |Passed!|Failed!" mutation.log | tail -n 20
          echo "OK: os testes detectaram a regra quebrada."
          git checkout -- "$file"
          rm mutation.log

      - name: Commit da migration
        if: steps.migration.outputs.created == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MIGRATIONS_DIR"
          git status --short
          git commit -m "feat: migration inicial gerada pelo dotnet-ef"
          git push
